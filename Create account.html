<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Tamkini</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .signup-box {
            width: 430px;
            max-width: 90%;
            padding: 35px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .logo {
            font-size: 38px;
            font-weight: bold;
            color: #3157a6;
            margin-bottom: 5px;
        }

        h2 {
            margin-top: 5px;
            margin-bottom: 25px;
            color: #222;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .create-btn {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #3157a6;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <div class="logo">Tamkini</div>

        <h2>Create Account</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
        >

        <button
            type="button"
            class="create-btn"
            onclick="createAccount()"
        >
            Create Account
        </button>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Sign In</a>
        </div>

    </div>

    <script>

        async function createAccount() {

            const username =
                document.getElementById("username").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (!username || !email || !password || !confirmPassword) {

                alert("Please fill in all fields.");
                return;
            }


            if (password !== confirmPassword) {

                alert("Passwords do not match.");
                return;
            }


            try {

                const response = await fetch(
                    "http://127.0.0.1:5000/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: username,
                            email: email,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (data.success) {

                    alert("Account created successfully!");

                    window.location.href = "login.html";

                } else {

                    alert(data.message);

                }

            } catch (error) {

                alert("Cannot connect to Tamkini server.");

                console.error(error);
            }
        }

    </script>

</body>

</html>
