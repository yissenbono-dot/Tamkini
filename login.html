<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tamkini - Sign In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="login-card">

        <div class="profile-logo">
            <img src="WhatsApp Image 2026-09-28 at 10.26.24 PM.jpeg"
                 alt="Tamkini Profile">
        </div>

        <h1>Tamkini</h1>

        <p class="tagline">Sign In</p>

        <form onsubmit="login(event)">

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <br>
            <br>

            I don't have an account?
            <a href="Create account.html">Create account</a>

            <p id="error-message"></p>

            <button type="submit">
                Sign In
            </button>

        </form>

    </main>

    <script>

        async function login(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const errorMessage =
                document.getElementById("error-message");

            errorMessage.textContent = "";

            try {

                const response = await fetch(
                    "http://127.0.0.1:5000/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {

                    localStorage.setItem(
                        "tamkiniUsername",
                        data.user.name
                    );

                    localStorage.setItem(
                        "tamkiniEmail",
                        data.user.email
                    );

                    window.location.href = "dashboard.html";

                } else {

                    errorMessage.textContent =
                        data.message || "Invalid username or password.";

                }

            } catch (error) {

                errorMessage.textContent =
                    "Cannot connect to Tamkini server.";

                console.error(error);
            }
        }

    </script>
    <button onclick="logout()">Log Out</button>
<script>
function logout() {
    localStorage.removeItem("tamkiniUsername");
    localStorage.removeItem("tamkiniEmail");

    window.location.href = "login.html";
}
</script>
</body>
</html>
